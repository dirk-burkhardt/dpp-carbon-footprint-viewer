# Sicherheits-Header für alle Antworten der Oberfläche (nicht für /api, die API setzt eigene).
# Die Content-Security-Policy wird beim Start aus den konfigurierten Karten- und Geocoding-Diensten erzeugt.
add_header Content-Security-Policy $dppviewer_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
