[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-footprint-api"
dynamic = ["version"]
description = "Backend für die Carbon-Footprint-Auswertung von AAS- und AASX-Dateien"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "lxml>=6.1.3",
    "httpx2>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
test = ["pytest>=9.2.0"]
dev = ["pytest>=9.2.0", "ruff>=0.17.5", "mypy>=2.4.1", "pip-audit>=2.10.1", "lxml-stubs>=0.5.1"]

[project.scripts]
carbon-footprint-api = "carbon_footprint_api.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "carbon_footprint_api.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["error::DeprecationWarning:carbon_footprint_api.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = [
    "UP007",   # Optional[...] bleibt lesbarer für Python 3.10
    "UP045",
    "RUF001", "RUF002", "RUF003",  # typografische Zeichen in deutschen Texten
    "B008",    # FastAPI-Parameter als Standardwerte
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S310", "S314"]

[tool.mypy]
python_version = "3.10"
packages = ["carbon_footprint_api"]
mypy_path = "src"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
