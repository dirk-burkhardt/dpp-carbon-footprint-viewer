# DPPviewer: API and user interface as separate containers.
#
#   docker compose up -d --build     build and start, then http://localhost:5001
#   docker compose logs -f           follow the logs
#   docker compose restart api       after changes in the folder repo (files are loaded on startup)
#   docker compose down              stop
#
# Settings (port, uploads, map and geocoding services) in a file .env next to this file, see .env.example.
# The image versions are maintained by tools/bump_version.py.

name: dppviewer

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *hardening
    build:
      context: ./carbon-footprint-api
      args:
        VERSION: "4.9.0"
    image: dppviewer-api:4.9.0
    environment:
      CFA_AASX: /opt/repo/*.aasx
      CFA_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      CFA_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      CFA_EXTERNAL_SHELLS_ENABLED: ${API_EXTERNAL_SHELLS_ENABLED:-true}
      # Uploaded files are stored in repo/uploads and deleted after expiry and on every restart
      CFA_UPLOADS_ENABLED: ${UPLOADS_ENABLED:-true}
      CFA_UPLOAD_DIR: /opt/repo/uploads
      CFA_UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
      CFA_UPLOAD_TTL_HOURS: ${UPLOAD_TTL_HOURS:-3}
      # The API is only reachable through the UI container, whose forwarding headers are trusted
      CFA_FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./repo:/opt/repo:ro
      # Only writable folder; on Linux it must belong to the user 10001 of the container
      - ./repo/uploads:/opt/repo/uploads
    networks:
      - backend
    # No port to the outside: access only through the user interface (/api), Swagger under /api/docs
    deploy:
      resources:
        limits:
          memory: 2g

  ui:
    <<: *hardening
    build:
      context: ./carbon-footprint-ui
      args:
        VERSION: "1.8.1"
    image: dppviewer-ui:1.8.1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-5001}:8080"
    environment:
      API_UPSTREAM: api:8080
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
      GEOCODING_URL: ${GEOCODING_URL:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  backend: {}
